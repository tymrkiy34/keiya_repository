<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歯科医院 情報共有</title>
<style>
  :root { --bg:#f4f8fa; --card:#fff; --fg:#1f2d3a; --muted:#6b7b88; --accent:#1a8fa8; --line:#dfe7ec; --warn:#e89b1a; --danger:#d9453b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14191d; --card:#1d252b; --fg:#e6edf1; --muted:#8a9aa6; --line:#2c373f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--accent); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header input { padding:6px 8px; border-radius:6px; border:0; width:130px; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button, .btn { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:16px; cursor:pointer; font-size:14px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); border-radius:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .card.unread { border-left:4px solid var(--accent); }
  .card.p-重要 { border-left:4px solid var(--warn); }
  .card.p-緊急 { border-left:4px solid var(--danger); }
  .meta { font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:1px 8px; }
  .tag.d { background:var(--danger); color:#fff; border-color:var(--danger); }
  .tag.w { background:var(--warn); color:#fff; border-color:var(--warn); }
  h3 { margin:6px 0; font-size:16px; }
  .body { white-space:pre-wrap; margin:8px 0; }
  .actions { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  form.new { display:grid; gap:8px; }
  form.new input, form.new select, form.new textarea { padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; width:100%; }
  form.new .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .note { font-size:12px; color:var(--muted); }
  @media (max-width:520px){ form.new .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>🦷 歯科医院 情報共有</h1>
  <label>あなたの名前 <input id="me" placeholder="例: 山田"></label>
</header>
<main>
  <div class="card">
    <details>
      <summary><b>＋ 新規投稿</b></summary>
      <form class="new" id="form" style="margin-top:10px">
        <input name="title" placeholder="タイトル" required maxlength="100">
        <div class="row">
          <select name="category"></select>
          <select name="priority"></select>
          <input name="date" type="date" title="日付（予定など）">
        </div>
        <textarea name="body" rows="4" placeholder="内容" maxlength="5000"></textarea>
        <button class="btn primary" type="submit">投稿する</button>
        <div class="note">※ 患者の氏名など個人を特定できる情報は書かないでください（イニシャルや患者番号を使用）。</div>
      </form>
    </details>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let posts = [], meta = { categories: [], priorities: [] }, filter = 'すべて';

const me = () => $('#me').value.trim();
$('#me').value = localStorage.getItem('me') || '';
$('#me').addEventListener('input', () => { localStorage.setItem('me', me()); render(); });

async function api(url, opt) {
  const r = await fetch(url, opt && { ...opt, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(opt.body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'エラー');
  return j;
}

async function init() {
  meta = await api('/api/meta');
  $('[name=category]').innerHTML = meta.categories.map((c) => `<option>${c}</option>`).join('');
  $('[name=priority]').innerHTML = meta.priorities.map((c) => `<option>${c}</option>`).join('');
  await refresh();
  setInterval(refresh, 30000);
}

async function refresh() { posts = await api('/api/posts'); render(); }

function render() {
  const cats = ['すべて', '未読', ...meta.categories];
  $('#tabs').innerHTML = cats.map((c) => `<button class="${c === filter ? 'on' : ''}" data-c="${c}">${c}</button>`).join('');
  const name = me();
  let list = posts.filter((p) => filter === 'すべて' ? true : filter === '未読' ? name && !p.readBy.includes(name) : p.category === filter);
  list = [...list].sort((a, b) => (b.pinned - a.pinned) || (b.createdAt.localeCompare(a.createdAt)));
  $('#list').innerHTML = list.length ? list.map((p) => {
    const unread = name && !p.readBy.includes(name);
    const pri = p.priority === '緊急' ? '<span class="tag d">緊急</span>' : p.priority === '重要' ? '<span class="tag w">重要</span>' : '';
    return `<div class="card p-${p.priority} ${unread ? 'unread' : ''}">
      <div class="meta">${p.pinned ? '📌' : ''}${pri}<span class="tag">${esc(p.category)}</span>
        <span>${esc(p.author)}</span><span>${new Date(p.createdAt).toLocaleString('ja-JP')}</span>
        ${p.date ? `<span>📅 ${esc(p.date)}</span>` : ''}</div>
      <h3>${esc(p.title)}</h3>
      <div class="body">${esc(p.body)}</div>
      <div class="actions">
        ${unread ? `<button class="btn primary" data-act="read" data-id="${p.id}">既読にする</button>` : ''}
        <button class="btn" data-act="pin" data-id="${p.id}">${p.pinned ? 'ピン解除' : 'ピン留め'}</button>
        <button class="btn" data-act="del" data-id="${p.id}">削除</button>
        <span class="note">既読 ${p.readBy.length}人: ${esc(p.readBy.join('、'))}</span>
      </div></div>`;
  }).join('') : '<p class="note">投稿はありません。</p>';
}

$('#tabs').addEventListener('click', (e) => { if (e.target.dataset.c) { filter = e.target.dataset.c; render(); } });

$('#list').addEventListener('click', async (e) => {
  const { act, id } = e.target.dataset;
  if (!act) return;
  try {
    if (act === 'read') {
      if (!me()) return alert('先に右上の名前を入力してください');
      await api(`/api/posts/${id}/read`, { method: 'POST', body: { name: me() } });
    } else if (act === 'pin') await api(`/api/posts/${id}/pin`, { method: 'POST' });
    else if (act === 'del') {
      if (!confirm('この投稿を削除しますか？')) return;
      await fetch(`/api/posts/${id}`, { method: 'DELETE' });
    }
    await refresh();
  } catch (err) { alert(err.message); }
});

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!me()) return alert('先に右上の名前を入力してください');
  const body = Object.fromEntries(new FormData(e.target));
  body.author = me();
  try {
    await api('/api/posts', { method: 'POST', body });
    e.target.reset();
    e.target.closest('details').open = false;
    await refresh();
  } catch (err) { alert(err.message); }
});

init();
</script>
</body>
</html>
